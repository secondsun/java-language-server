name: Java CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Java 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'oracle'
        cache: 'maven'

    - name: Make wrapper executable
      run: chmod +x mvnw

    - name: Build and Test with Maven
      run: ./mvnw clean verify

