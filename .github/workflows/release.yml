name: Release and Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
      - 'languageserver-*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Java 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'oracle'
        cache: 'maven'

    - name: Make wrapper executable
      run: chmod +x mvnw

    - name: Set up GPG signing key
      if: env.GPG_PRIVATE_KEY != ''
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        echo "GPG key imported."

    - name: Deploy to Sonatype Central Portal
      env:
        CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
        CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        mkdir -p ~/.m2
        cat <<EOF > ~/.m2/settings.xml
        <settings>
          <servers>
            <server>
              <id>central</id>
              <username>${CENTRAL_USERNAME}</username>
              <password>${CENTRAL_PASSWORD}</password>
            </server>
          </servers>
        </settings>
        EOF
        ./mvnw clean deploy -P release --no-transfer-progress
